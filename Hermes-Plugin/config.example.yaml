# Пример конфигурации TTS-провайдера deepseek-session.
# Скопировать нужные ключи в config.yaml профиля Hermes (секция tts).

tts:
  # имя провайдера совпадает с его name в плагине
  provider: deepseek-session

  deepseek-session:
    # Адрес локального DeepSeek-прокси.
    base_url: http://127.0.0.1:18632

    # Голос: mira | echo | stella | tide
    voice: mira

    # ОБЯЗАТЕЛЬНО. Hermes режет текст на чанки по этому значению,
    # а для незнакомого провайдера берёт 4000. Плагин текст игнорирует,
    # поэтому N чанков = один ответ, озвученный N раз подряд.
    max_text_length: 1000000

    # Таймаут одного HTTP-запроса к прокси, секунды.
    timeout: 300

    # Сколько ждать, пока прокси сгенерирует свежий ответ (503 message_pending).
    pending_wait: 45
    pending_poll: 0.7

    # ОТЛАДОЧНЫЙ OVERRIDE. Если задан, поиск по тексту не выполняется:
    # берётся самая свежая известная сессия и озвучивается ответ с этим
    # номером. Для обычной работы ключ должен ОТСУТСТВОВАТЬ.
    # message_index: 12
